# Kubernetes manifests for the 3 services. Plain yaml, not applied to
# a real cluster here: there is no cluster in this project. To use
# them, build the 3 images from the Dockerfiles, push them to a
# registry, replace the image names below, then run:
#   kubectl apply -f k8s/
# Each Deployment has a liveness and readiness probe on /health.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: question-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: question-service
  template:
    metadata:
      labels:
        app: question-service
    spec:
      containers:
        - name: question-service
          image: internal-ai-platform-question:latest
          ports:
            - containerPort: 8001
          env:
            - name: PORT
              value: "8001"
            - name: RETRIEVAL_URL
              value: "http://retrieval-service:8002"
            - name: ANSWER_URL
              value: "http://answer-service:8003"
          livenessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8001
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "256Mi"
---
